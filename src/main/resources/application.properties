spring.application.name=Cine_V2
spring.datasource.url=jdbc:mysql://localhost:3307/cine_db
spring.datasource.username=cine_user
spring.datasource.password=cine_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 1. El secreto. ¡OJO! Debe tener al menos 32 caracteres para ser seguro con HS256.
# Tu maestro recomienda usar ${JWT_SECRET} por variables de entorno,
# pero para probar rápido ahora mismo puedes poner una cadena larga directa:
jwt.secret=MiClaveSuperSecreta12345678901234567890

# 2. Tiempo de expiración en milisegundos (1 hora = 3600000 ms)
jwt.expiration=3600000
